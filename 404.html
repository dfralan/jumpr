<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jumpr</title>
  <style>
    /* Loader */
    .loader {
      height: 60px;
      aspect-ratio: 2;
      border: 15px solid #fff;
      box-sizing: border-box;
      background: 
        radial-gradient(farthest-side,#FF6600 98%,#0000) left/30px 30px,
        radial-gradient(farthest-side,#FF6600 98%,#0000) left/30px 30px,
        radial-gradient(farthest-side,#FF6600 98%,#0000) center/30px 30px,
        radial-gradient(farthest-side,#FF6600 98%,#0000) right/30px 30px,
        #fff;
      background-repeat: no-repeat;
      filter: blur(4px) contrast(10);
      animation: l14 1s ease-in-out infinite;
    }
    @keyframes l14 {
      100%  {background-position:right,left,center,right}
    }

    /* Container: Flexbox centered layout */
    .container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      align-items: center;
      justify-content: center;
      background-color: #f8fafc; /* Light background */
    }

    /* Title styling */
    .title {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif,
        "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
      font-weight: bold;
      color: #0f172a; /* slate-900 */
      font-size: 1.5rem; /* text-2xl (24px) */
      margin-bottom: 1rem;
    }
      
    #message {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif,
        "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
      color: red; /* slate-900 */
      font-size: 1.2rem; /* text-2xl (24px) */
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">jumpr</h1>
    <div class="loader"></div>
    <div id="message"></div>
  </div>
<script>
        // Definir el objeto de trampolines
        const trampolins = {
            trampolin: [
                { origin: 'xDefT', redirection: 'https://wa.me/5493412293515' },
                { origin: 'dToRy', redirection: 'https://wa.me/5493435039377' },
                { origin: 'tTeEs', redirection: 'https://cooperativaesmeralda.netlify.app'},
                { origin: '3MrTt', redirection: 'https://mrtabaco.com.ar'},
                { origin: 'lo', redirection: 'https://logicomnipresence.com'},
                // Puedes agregar más aquí si lo necesitas
            ]
        };

        // Obtener el slug de la URL
        const slug = window.location.pathname.split('/').pop();

        // Guardar el slug en localStorage
        localStorage.setItem('lastSlug', slug);

        // Buscar si el slug coincide con algún origin en el objeto
        const match = trampolins.trampolin.find(t => t.origin === slug);

        if (match) {
            // Si hay match, redirigir a la URL de redirección
            window.location.href = match.redirection;
        } else {
            // Si no hay match, mostrar el mensaje de que la URL no existe
            document.getElementById('message').innerText = 'La URL que solicitas no existe.';
        }
    </script>
</body>
</html>
